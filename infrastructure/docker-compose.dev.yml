services:
  nginx:
    image: nginx:alpine
    container_name: preorder-dev-nginx
    ports:
      - "8081:80"
    volumes:
      - ../:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - preorder-dev

  app:
    build:
      context: ./docker/php
    container_name: preorder-dev-app
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - preorder-dev

  mysql:
    image: mariadb:11
    container_name: preorder-dev-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: preorder_dev
      MYSQL_USER: preorder
      MYSQL_PASSWORD: preorder_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    volumes:
      - preorder-dev-mysql-data:/var/lib/mysql
    networks:
      - preorder-dev

  redis:
    image: redis:alpine
    container_name: preorder-dev-redis
    restart: unless-stopped
    networks:
      - preorder-dev

  mailpit:
    image: axllent/mailpit
    container_name: preorder-dev-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - preorder-dev

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: preorder-dev-phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - preorder-dev

networks:
  preorder-dev:
    driver: bridge

volumes:
  preorder-dev-mysql-data: